<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚀 SPACE BLASTER</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap");

      :root {
        --neon-cyan: #00f5ff;
        --neon-pink: #ff0080;
        --neon-yellow: #ffee00;
        --neon-green: #00ff88;
        --dark: #050510;
        --darker: #020208;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--darker);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Orbitron", monospace;
        overflow: hidden;
        user-select: none;
      }

      /* Animated starfield background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            1px 1px at 10% 15%,
            rgba(255, 255, 255, 0.8) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 30% 40%,
            rgba(255, 255, 255, 0.6) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 50% 25%,
            rgba(255, 255, 255, 0.9) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 70% 60%,
            rgba(255, 255, 255, 0.7) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 85% 20%,
            rgba(255, 255, 255, 0.5) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 20% 75%,
            rgba(255, 255, 255, 0.8) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 60% 85%,
            rgba(255, 255, 255, 0.6) 0%,
            transparent 100%
          ),
          radial-gradient(
            2px 2px at 90% 45%,
            rgba(0, 245, 255, 0.5) 0%,
            transparent 100%
          ),
          radial-gradient(
            2px 2px at 40% 90%,
            rgba(255, 0, 128, 0.4) 0%,
            transparent 100%
          );
        animation: starMove 20s linear infinite;
        pointer-events: none;
      }

      @keyframes starMove {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(100vh);
        }
      }

      #gameWrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      h1 {
        font-size: clamp(1.2rem, 4vw, 2rem);
        font-weight: 900;
        letter-spacing: 6px;
        color: var(--neon-cyan);
        text-shadow:
          0 0 10px var(--neon-cyan),
          0 0 30px var(--neon-cyan),
          0 0 60px var(--neon-cyan);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      #hud {
        display: flex;
        gap: 30px;
        font-family: "Share Tech Mono", monospace;
        font-size: 0.9rem;
        color: var(--neon-green);
        text-shadow: 0 0 8px var(--neon-green);
        letter-spacing: 2px;
      }

      #hud span {
        opacity: 0.7;
      }
      #hud b {
        color: var(--neon-yellow);
        text-shadow: 0 0 8px var(--neon-yellow);
      }

      canvas {
        display: block;
        border: 1px solid rgba(0, 245, 255, 0.3);
        box-shadow:
          0 0 20px rgba(0, 245, 255, 0.2),
          0 0 60px rgba(0, 245, 255, 0.1),
          inset 0 0 30px rgba(0, 0, 50, 0.8);
        border-radius: 4px;
        cursor: none;
      }

      #controls {
        font-family: "Share Tech Mono", monospace;
        font-size: 0.7rem;
        color: rgba(0, 245, 255, 0.4);
        letter-spacing: 2px;
        text-align: center;
        line-height: 1.8;
      }

      /* Mobile touch controls */
      #mobileControls {
        display: none;
        gap: 12px;
        margin-top: 8px;
      }

      .btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid var(--neon-cyan);
        background: rgba(0, 245, 255, 0.05);
        color: var(--neon-cyan);
        font-size: 1.4rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 12px rgba(0, 245, 255, 0.3);
        -webkit-tap-highlight-color: transparent;
        transition: background 0.1s;
      }

      .btn:active,
      .btn.active {
        background: rgba(0, 245, 255, 0.25);
        box-shadow: 0 0 24px rgba(0, 245, 255, 0.6);
      }

      .btnRow {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      #fireBtn {
        width: 72px;
        height: 72px;
        border-color: var(--neon-pink);
        color: var(--neon-pink);
        box-shadow: 0 0 12px rgba(255, 0, 128, 0.3);
      }

      #fireBtn:active,
      #fireBtn.active {
        background: rgba(255, 0, 128, 0.25);
        box-shadow: 0 0 24px rgba(255, 0, 128, 0.6);
      }

      @media (max-width: 600px) {
        #mobileControls {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameWrapper">
      <h1>✦ SPACE BLASTER ✦</h1>
      <div id="hud">
        <div><span>SCORE </span><b id="scoreVal">0</b></div>
        <div><span>LEVEL </span><b id="levelVal">1</b></div>
        <div><span>LIVES </span><b id="livesVal">♥ ♥ ♥</b></div>
      </div>
      <canvas id="c" width="480" height="580"></canvas>
      <div id="controls">
        ← → HARAKAT &nbsp;|&nbsp; SPACE OTISH &nbsp;|&nbsp; P TO'XTATISH
      </div>
      <div id="mobileControls">
        <div class="btnRow">
          <button class="btn" id="leftBtn">◀</button>
          <button class="btn" id="fireBtn" style="font-size: 1rem">
            OTISH
          </button>
          <button class="btn" id="rightBtn">▶</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const W = canvas.width,
        H = canvas.height;

      // State
      let state = "start"; // start | playing | paused | dead | win
      let score = 0,
        lives = 3,
        level = 1;
      let animId;

      // Input
      const keys = {};
      document.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (e.code === "Space") {
          e.preventDefault();
          firePlayer();
        }
        if (e.code === "KeyP") togglePause();
        if ((e.code === "Enter" || e.code === "Space") && state === "start")
          startGame();
        if ((e.code === "Enter" || e.code === "Space") && state === "dead")
          startGame();
      });
      document.addEventListener("keyup", (e) => (keys[e.code] = false));

      // Mobile buttons
      let mobileLeft = false,
        mobileRight = false,
        mobileFire = false;
      const leftBtn = document.getElementById("leftBtn");
      const rightBtn = document.getElementById("rightBtn");
      const fireBtn2 = document.getElementById("fireBtn");

      function addTouch(btn, setFn) {
        btn.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            setFn(true);
            btn.classList.add("active");
          },
          { passive: false },
        );
        btn.addEventListener(
          "touchend",
          (e) => {
            e.preventDefault();
            setFn(false);
            btn.classList.remove("active");
          },
          { passive: false },
        );
        btn.addEventListener("mousedown", () => {
          setFn(true);
          btn.classList.add("active");
        });
        btn.addEventListener("mouseup", () => {
          setFn(false);
          btn.classList.remove("active");
        });
      }
      addTouch(leftBtn, (v) => (mobileLeft = v));
      addTouch(rightBtn, (v) => (mobileRight = v));
      addTouch(fireBtn2, (v) => {
        if (v) firePlayer();
      });

      // Player
      let player;
      function makePlayer() {
        return {
          x: W / 2,
          y: H - 70,
          w: 40,
          h: 40,
          speed: 5,
          color: "#00f5ff",
          cooldown: 0,
        };
      }

      // Bullets & enemies & particles
      let bullets = [],
        enemyBullets = [],
        enemies = [],
        particles = [],
        stars = [],
        powerups = [];
      let enemyDir = 1,
        enemyMoveTimer = 0,
        enemyShootTimer = 0;
      let fireInterval = null,
        mobileFiring = false;

      function makeStar() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.3,
          speed: Math.random() * 1.5 + 0.3,
          bright: Math.random(),
        };
      }

      function initStars() {
        stars = Array.from({ length: 80 }, makeStar);
      }

      function makeEnemyRow(row) {
        const cols = 9,
          startX = 30,
          gap = 46;
        const types = ["○"];
        return Array.from({ length: cols }, (_, i) => ({
          x: startX + i * gap,
          y: 60 + row * 52,
          w: 34,
          h: 34,
          alive: true,
          type: types[row % types.length],
          color: ["#ff0080", "#ff6600", "#ffee00", "#00ff88", "#ff00ff"][
            row % 5
          ],
          hp: row < 2 ? 1 : row < 4 ? 2 : 3,
          maxhp: row < 2 ? 1 : row < 4 ? 2 : 3,
          flash: 0,
        }));
      }

      function initEnemies() {
        enemies = [];
        const rows = Math.min(3 + level, 6);
        for (let r = 0; r < rows; r++) enemies.push(...makeEnemyRow(r));
        enemyDir = 1;
      }

      // Particles
      function explode(x, y, color, n = 14) {
        for (let i = 0; i < n; i++) {
          const angle = ((Math.PI * 2) / n) * i + Math.random() * 0.5;
          const spd = Math.random() * 3 + 1;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1,
            decay: 0.025 + Math.random() * 0.03,
            r: Math.random() * 3 + 1,
            color,
          });
        }
      }

      // Fire
      let fireCooldown = 0;
      function firePlayer() {
        if (state !== "playing") {
          if (state === "start" || state === "dead") startGame();
          return;
        }
        if (fireCooldown > 0) return;
        bullets.push({
          x: player.x + player.w / 2 - 2,
          y: player.y,
          w: 4,
          h: 14,
          speed: 9,
          color: "#ffee00",
        });
        fireCooldown = 12;
        // Sound-like flash
        player.flash = 3;
      }

      // Mobile fire hold
      setInterval(() => {
        if (mobileLeft) {
          /* handled in update */
        }
        if (mobileFiring) firePlayer();
      }, 120);

      fireBtn2.addEventListener("touchstart", () => (mobileFiring = true), {
        passive: true,
      });
      fireBtn2.addEventListener("touchend", () => (mobileFiring = false), {
        passive: true,
      });
      fireBtn2.addEventListener("mousedown", () => (mobileFiring = true));
      fireBtn2.addEventListener("mouseup", () => (mobileFiring = false));

      function togglePause() {
        if (state === "playing") state = "paused";
        else if (state === "paused") state = "playing";
      }

      function startGame() {
        score = 0;
        lives = 3;
        level = 1;
        player = makePlayer();
        bullets = [];
        enemyBullets = [];
        particles = [];
        powerups = [];
        initEnemies();
        initStars();
        updateHUD();
        state = "playing";
        if (!animId) loop();
      }

      function nextLevel() {
        level++;
        bullets = [];
        enemyBullets = [];
        particles = [];
        powerups = [];
        player.x = W / 2 - player.w / 2;
        initEnemies();
        updateHUD();
        state = "playing";
      }

      function updateHUD() {
        document.getElementById("scoreVal").textContent = score;
        document.getElementById("levelVal").textContent = level;
        const hearts = ["♡", "♡", "♡"];
        for (let i = 0; i < lives; i++) hearts[i] = "♥";
        document.getElementById("livesVal").textContent = hearts.join(" ");
      }

      // Main loop
      function update() {
        if (state !== "playing") return;

        // Stars
        stars.forEach((s) => {
          s.y += s.speed;
          if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
          }
        });

        // Player movement
        const isLeft = keys["ArrowLeft"] || keys["KeyA"] || mobileLeft;
        const isRight = keys["ArrowRight"] || keys["KeyD"] || mobileRight;
        if (isLeft) player.x -= player.speed;
        if (isRight) player.x += player.speed;
        player.x = Math.max(0, Math.min(W - player.w, player.x));
        if (player.flash > 0) player.flash--;

        // Fire cooldown
        if (fireCooldown > 0) fireCooldown--;

        // Bullets
        bullets = bullets.filter((b) => b.y + b.h > 0);
        bullets.forEach((b) => (b.y -= b.speed));

        // Enemy movement
        enemyMoveTimer++;
        const speed =
          0.4 +
          level * 0.2 +
          (1 - enemies.filter((e) => e.alive).length / 50) * 0.8;
        const moveEvery = Math.max(4, 18 - level * 2);
        if (enemyMoveTimer >= moveEvery) {
          enemyMoveTimer = 0;
          let hitWall = false;
          const alive = enemies.filter((e) => e.alive);
          alive.forEach((e) => {
            e.x += 14 * enemyDir;
          });
          alive.forEach((e) => {
            if (e.x < 8 || e.x + e.w > W - 8) hitWall = true;
          });
          if (hitWall) {
            enemyDir *= -1;
            alive.forEach((e) => {
              e.y += 18;
            });
          }
          // Enemy flash
          enemies.forEach((e) => {
            if (e.flash > 0) e.flash--;
          });
        }

        // Enemy shoot
        enemyShootTimer++;
        const shootEvery = Math.max(30, 80 - level * 8);
        if (enemyShootTimer >= shootEvery) {
          enemyShootTimer = 0;
          const alive = enemies.filter((e) => e.alive);
          if (alive.length > 0) {
            // Bottom enemies of each column shoot
            const cols = {};
            alive.forEach((e) => {
              const col = Math.round(e.x / 46);
              if (!cols[col] || e.y > cols[col].y) cols[col] = e;
            });
            const shooters = Object.values(cols);
            // random 1-3 shoot
            const n = Math.min(shooters.length, 1 + Math.floor(level / 2));
            for (let i = 0; i < n; i++) {
              const s = shooters[Math.floor(Math.random() * shooters.length)];
              enemyBullets.push({
                x: s.x + s.w / 2 - 2,
                y: s.y + s.h,
                w: 4,
                h: 12,
                speed: 3 + level * 0.4,
                color: s.color,
              });
            }
          }
        }

        // Enemy bullets
        enemyBullets = enemyBullets.filter((b) => b.y < H);
        enemyBullets.forEach((b) => (b.y += b.speed));

        // Collisions: player bullets vs enemies
        bullets.forEach((b, bi) => {
          enemies.forEach((e) => {
            if (!e.alive) return;
            if (
              b.x < e.x + e.w &&
              b.x + b.w > e.x &&
              b.y < e.y + e.h &&
              b.y + b.h > e.y
            ) {
              b.hit = true;
              e.hp--;
              e.flash = 6;
              if (e.hp <= 0) {
                e.alive = false;
                explode(e.x + e.w / 2, e.y + e.h / 2, e.color);
                score += 10 * level;
                // Chance powerup
                if (Math.random() < 0.08) {
                  powerups.push({
                    x: e.x + e.w / 2,
                    y: e.y + e.h / 2,
                    vy: 1.5,
                    r: 10,
                    life: 300,
                    color: "#00ff88",
                    type: "life",
                  });
                }
                updateHUD();
              }
            }
          });
        });
        bullets = bullets.filter((b) => !b.hit);

        // Collisions: enemy bullets vs player
        enemyBullets.forEach((b, bi) => {
          if (b.hit) return;
          if (
            b.x < player.x + player.w &&
            b.x + b.w > player.x &&
            b.y < player.y + player.h &&
            b.y + b.h > player.y
          ) {
            b.hit = true;
            lives--;
            updateHUD();
            explode(
              player.x + player.w / 2,
              player.y + player.h / 2,
              "#ff0080",
              20,
            );
            if (lives <= 0) {
              state = "dead";
              return;
            }
            player.x = W / 2 - player.w / 2;
          }
        });
        enemyBullets = enemyBullets.filter((b) => !b.hit);

        // Enemy reaches bottom
        enemies.forEach((e) => {
          if (e.alive && e.y + e.h >= player.y) {
            state = "dead";
          }
        });

        // Powerups
        powerups = powerups.filter((p) => p.life > 0 && p.y < H);
        powerups.forEach((p) => {
          p.y += p.vy;
          p.life--;
          if (
            p.x > player.x &&
            p.x < player.x + player.w &&
            p.y > player.y &&
            p.y < player.y + player.h
          ) {
            if (p.type === "life" && lives < 5) {
              lives++;
              updateHUD();
            }
            explode(p.x, p.y, p.color, 8);
            p.life = 0;
          }
        });

        // Particles
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05;
          p.life -= p.decay;
        });
        particles = particles.filter((p) => p.life > 0);

        // Level complete
        if (enemies.every((e) => !e.alive)) {
          state = "levelup";
          setTimeout(nextLevel, 1500);
        }
      }

      // Drawing helpers
      function drawShip(x, y, w, h, color, flash) {
        const cx = x + w / 2;
        const c2 = flash > 0 ? "#ffffff" : color;
        ctx.save();
        // Engine glow
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        // Body
        ctx.fillStyle = c2;
        ctx.beginPath();
        ctx.moveTo(cx, y);
        ctx.lineTo(cx - w / 2, y + h);
        ctx.lineTo(cx - w / 4, y + h * 0.75);
        ctx.lineTo(cx, y + h * 0.85);
        ctx.lineTo(cx + w / 4, y + h * 0.75);
        ctx.lineTo(cx + w / 2, y + h);
        ctx.closePath();
        ctx.fill();
        // Cockpit
        ctx.fillStyle =
          flash > 0 ? "#ffffffcc" : color === "#00f5ff" ? "#003355" : "#330011";
        ctx.beginPath();
        ctx.ellipse(cx, y + h * 0.35, w * 0.18, h * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        // Engine trail
        if (color === "#00f5ff") {
          ctx.shadowColor = "#ff6600";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "rgba(255,120,0,0.7)";
          ctx.beginPath();
          ctx.moveTo(cx - w * 0.22, y + h);
          ctx.lineTo(cx, y + h + 14 + Math.sin(Date.now() / 80) * 4);
          ctx.lineTo(cx + w * 0.22, y + h);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawEnemy(e) {
        if (!e.alive) return;
        const cx = e.x + e.w / 2,
          cy = e.y + e.h / 2;
        const c = e.flash > 0 ? "#ffffff" : e.color;
        ctx.save();
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = c;
        ctx.strokeStyle = c;
        ctx.lineWidth = 2;
        ctx.font = `bold ${e.w - 4}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(e.type, cx, cy);
        // HP bar
        if (e.maxhp > 1) {
          const bw = e.w - 4,
            bh = 3;
          ctx.fillStyle = "#111";
          ctx.fillRect(e.x + 2, e.y - 7, bw, bh);
          ctx.fillStyle = e.color;
          ctx.shadowBlur = 6;
          ctx.fillRect(e.x + 2, e.y - 7, bw * (e.hp / e.maxhp), bh);
        }
        ctx.restore();
      }

      function drawBullet(b, isEnemy) {
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = b.color;
        if (isEnemy) {
          ctx.beginPath();
          ctx.ellipse(
            b.x + b.w / 2,
            b.y + b.h / 2,
            b.w / 2 + 1,
            b.h / 2 + 1,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        } else {
          ctx.fillRect(b.x, b.y, b.w, b.h);
          // glow trail
          const grad = ctx.createLinearGradient(
            b.x + b.w / 2,
            b.y,
            b.x + b.w / 2,
            b.y + b.h + 8,
          );
          grad.addColorStop(0, b.color + "cc");
          grad.addColorStop(1, "transparent");
          ctx.fillStyle = grad;
          ctx.fillRect(b.x - 1, b.y, b.w + 2, b.h + 8);
        }
        ctx.restore();
      }

      function drawParticle(p) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        // Background
        ctx.fillStyle = "#050510";
        ctx.fillRect(0, 0, W, H);

        // Stars
        stars.forEach((s) => {
          ctx.save();
          ctx.globalAlpha = 0.4 + s.bright * 0.6;
          ctx.fillStyle = `hsl(${200 + s.bright * 60},80%,${70 + s.bright * 30}%)`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        if (state === "start") {
          drawStartScreen();
          return;
        }
        if (state === "dead") {
          // Draw particles then game over
          particles.forEach(drawParticle);
          drawGameOver();
          return;
        }

        // Enemies
        enemies.forEach(drawEnemy);

        // Powerups
        powerups.forEach((p) => {
          ctx.save();
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = p.color;
          ctx.font = "14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("♥", p.x, p.y);
          ctx.restore();
        });

        // Bullets
        bullets.forEach((b) => drawBullet(b, false));
        enemyBullets.forEach((b) => drawBullet(b, true));

        // Player
        drawShip(
          player.x,
          player.y,
          player.w,
          player.h,
          "#00f5ff",
          player.flash || 0,
        );

        // Particles
        particles.forEach(drawParticle);

        // HUD overlay
        if (state === "paused") {
          ctx.fillStyle = "rgba(5,5,16,0.7)";
          ctx.fillRect(0, 0, W, H);
          ctx.save();
          ctx.shadowColor = "#00f5ff";
          ctx.shadowBlur = 20;
          ctx.fillStyle = "#00f5ff";
          ctx.font = "bold 36px Orbitron";
          ctx.textAlign = "center";
          ctx.fillText("⏸ PAUZA", W / 2, H / 2);
          ctx.font = "14px Share Tech Mono";
          ctx.fillStyle = "rgba(0,245,255,0.6)";
          ctx.fillText("P - DAVOM ETTIRISH", W / 2, H / 2 + 40);
          ctx.restore();
        }

        if (state === "levelup") {
          ctx.save();
          ctx.shadowColor = "#ffee00";
          ctx.shadowBlur = 30;
          ctx.fillStyle = "#ffee00";
          ctx.font = "bold 30px Orbitron";
          ctx.textAlign = "center";
          ctx.fillText(`⭐ DARAJA ${level}! ⭐`, W / 2, H / 2);
          ctx.restore();
        }
      }

      function drawStartScreen() {
        ctx.save();
        // Title
        ctx.shadowColor = "#00f5ff";
        ctx.shadowBlur = 30;
        ctx.fillStyle = "#00f5ff";
        ctx.font = "bold 36px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText("SPACE BLASTER", W / 2, H / 2 - 80);

        ctx.shadowColor = "#ff0080";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#ff0080";
        ctx.font = "14px Orbitron";
        ctx.fillText("KOSMIK JANGCHI", W / 2, H / 2 - 45);

        // Demo enemy
        ctx.shadowColor = "#ffee00";
        ctx.shadowBlur = 15;
        ctx.fillStyle = "#ffee00";
        ctx.font = "bold 32px Arial";
        ["△", "□", "◇", "○", "★"].forEach((s, i) =>
          ctx.fillText(s, W / 2 - 80 + i * 40, H / 2),
        );

        ctx.shadowColor = "#00ff88";
        ctx.shadowBlur = 15;
        ctx.fillStyle = "#00ff88";
        ctx.font = "13px Share Tech Mono";
        ctx.fillText("← → HARAKAT  |  SPACE OTISH", W / 2, H / 2 + 55);
        ctx.fillText("P = TO'XTATISH", W / 2, H / 2 + 76);

        // Blink
        if (Math.floor(Date.now() / 600) % 2 === 0) {
          ctx.shadowColor = "#ffffff";
          ctx.shadowBlur = 20;
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 16px Orbitron";
          ctx.fillText("▶  BOSHLASH UCHUN ENTER  ◀", W / 2, H / 2 + 120);
        }
        ctx.restore();
      }

      function drawGameOver() {
        ctx.save();
        ctx.fillStyle = "rgba(5,5,16,0.8)";
        ctx.fillRect(0, 0, W, H);

        ctx.shadowColor = "#ff0080";
        ctx.shadowBlur = 40;
        ctx.fillStyle = "#ff0080";
        ctx.font = "bold 38px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", W / 2, H / 2 - 60);

        ctx.shadowColor = "#ffee00";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#ffee00";
        ctx.font = "bold 20px Orbitron";
        ctx.fillText(`BALL: ${score}`, W / 2, H / 2);

        ctx.fillStyle = `hsl(${score > 500 ? 140 : 60},100%,60%)`;
        ctx.font = "13px Share Tech Mono";
        ctx.fillText(
          score >= 1000
            ? "🏆 AJOYIB! CHAMPION!"
            : score >= 500
              ? "⭐ YAXSHI!"
              : "💪 QAYTA URINING!",
          W / 2,
          H / 2 + 35,
        );

        if (Math.floor(Date.now() / 700) % 2 === 0) {
          ctx.shadowColor = "#ffffff";
          ctx.shadowBlur = 15;
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 14px Orbitron";
          ctx.fillText("▶  QAYTA BOSHLASH  ◀", W / 2, H / 2 + 90);
        }
        ctx.restore();
      }

      function loop() {
        update();
        draw();
        animId = requestAnimationFrame(loop);
      }

      // Init
      initStars();
      loop();
    </script>
  </body>
</html>
